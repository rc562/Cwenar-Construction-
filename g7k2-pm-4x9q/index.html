<script>(async function(){
  var P=JSON.parse(document.getElementById('p').textContent),KEY='cw.petersen.key';
  var f=document.getElementById('f'),pw=document.getElementById('pw'),err=document.getElementById('err'),keep=document.getElementById('keep');
  var b2u=function(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a};
  var u2b=function(buf){var a=new Uint8Array(buf),s='';for(var i=0;i<a.length;i+=32768)s+=String.fromCharCode.apply(null,a.subarray(i,i+32768));return btoa(s)};
  document.getElementById('eye').onclick=function(){pw.type=pw.type==='password'?'text':'password';this.textContent=pw.type==='password'?'Show':'Hide';pw.focus()};
  if(!window.crypto||!crypto.subtle){err.textContent='Open this page with https:// in the address bar. The passcode lock needs a secure connection.';return;}
  async function open(k){var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(P.iv)},k,b2u(P.ct));var html=new TextDecoder().decode(pt);document.open();document.write(html);document.close();}
  async function fromPass(pass){var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:b2u(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);}
  var cached=sessionStorage.getItem(KEY)||localStorage.getItem(KEY);
  if(cached){try{var k=await crypto.subtle.importKey('raw',b2u(cached),'AES-GCM',true,['decrypt']);await open(k);return;}catch(e){sessionStorage.removeItem(KEY);localStorage.removeItem(KEY);}}
  f.style.visibility='visible';pw.focus();
  f.onsubmit=async function(ev){ev.preventDefault();err.textContent='';f.classList.add('busy');
    try{var key=await fromPass(pw.value.trim());var raw=u2b(await crypto.subtle.exportKey('raw',key));sessionStorage.setItem(KEY,raw);if(keep.checked)localStorage.setItem(KEY,raw);await open(key);}
    catch(e){f.classList.remove('busy');err.textContent="That's not it. Check the passcode and try again.";pw.select();}};
})();</script>
